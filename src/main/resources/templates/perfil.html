
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil - GamerFest</title>
</head>
<body>

    <h1>Mi perfil GamerFest</h1>

    <div th:if="${perfil != null}">

        <p>
            Nombre:
            <span th:text="${perfil.nombre}"></span>
        </p>
  
        <p>
            Nombre de usuario:
            <span th:text="${perfil.nombreUsuario}"></span>
        </p>

        <p>
            Correo:
            <span th:text="${perfil.email}"></span>
        </p>

        <div>
            <p>Avatar:</p>

            <img th:if="${perfil.avatar != null and !perfil.avatar.isBlank()}"
                th:src="${perfil.avatar}"
                alt="Avatar del usuario"
                width="120"
                height="120">
                
            <p th:if="${perfil.avatar == null or perfil.avatar.isBlank()}">
                Sin avatar configurado.
            </p>
        </div>

        <p>
            Juegos favoritos:
            <span th:text="${perfil.juegosFavoritos}"></span>
        </p>

        <p>
            Notificaciones:
            <span th:text="${perfil.notificaciones ? 'Activadas' : 'Desactivadas'}"></span>
        </p>

        <h2>Editar mi perfil</h2>

        <form th:action="@{/perfil}" method="post">

            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                    th:value="${perfil.nombre}" required>
            </div>

            <div>
                <label for="nombreUsuario">Nombre de usuario:</label>
                <input type="text"
                    id="nombreUsuario"
                    name="nombreUsuario"
                    th:value="${perfil.nombreUsuario}"
                    required>
            </div>

            <div>
                <label for="avatar">Avatar (URL de imagen):</label>
                <input type="url" id="avatar" name="avatar"
                    th:value="${perfil.avatar}">
            </div>

            <div>
                <label for="juegosFavoritos">Juegos favoritos:</label>
                <input type="text" id="juegosFavoritos" name="juegosFavoritos"
                    th:value="${perfil.juegosFavoritos}">
            </div>

            <div>
                <label for="notificaciones">Recibir notificaciones:</label>
                <input type="checkbox" id="notificaciones"
                    name="notificaciones"
                    th:checked="${perfil.notificaciones}">
            </div>

            <button type="submit">Guardar cambios</button>

        </form>

    </div>

    <p th:if="${perfil == null}">
        Este usuario todavía no tiene un perfil configurado.
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar sesión</button>
    </form>

</body>
</html>
