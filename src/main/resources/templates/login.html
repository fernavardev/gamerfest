<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="site-main">
    <div class="container">
        <div class="panel form-panel">
            <h1>Iniciar sesión</h1>
            <p>Entra con tu cuenta para ver eventos y tu perfil.</p>

            <p class="alert alert--error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
            <p class="alert alert--ok" th:if="${param.logout}">Sesión cerrada correctamente.</p>
            <p class="alert alert--ok" th:if="${param.registro}">Registro exitoso. Ya puedes iniciar sesión.</p>

            <form th:action="@{/login}" method="post" class="form-stack">
                <div class="form-field">
                    <label for="username">Usuario o correo</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn--primary">Ingresar</button>
            </form>

            <p style="margin-top: 1.25rem; margin-bottom: 0;">
                ¿No tienes cuenta?
                <a th:href="@{/registro}">Regístrate</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
