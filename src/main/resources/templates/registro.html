<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="site-main">
    <div class="container">
        <div class="panel form-panel">
            <h1>Registro</h1>
            <p>Crea tu cuenta para participar en GamerFest.</p>

            <p class="alert alert--error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/registro}" method="post" class="form-stack">
                <div class="form-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required autocomplete="name">
                </div>
                <div class="form-field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn--primary">Registrarse</button>
            </form>

            <p style="margin-top: 1.25rem; margin-bottom: 0;">
                ¿Ya tienes una cuenta?
                <a th:href="@{/login}">Iniciar sesión</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
