<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Eventos')}">
    <title>Eventos</title>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="site-main">
    <div class="container">
        <section class="section">
            <h1>Eventos GamerFest</h1>
            <p class="section__intro">Busca y filtra por nombre, videojuego, categoría, país, ciudad, fecha o modalidad.</p>

            <form th:action="@{/eventos}" method="get" class="panel form-filters">
                <div class="form-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre"
                           th:value="${nombre}" placeholder="Ej.: GamerFest">
                </div>
                <div class="form-field">
                    <label for="videojuego">Videojuego</label>
                    <input type="text" id="videojuego" name="videojuego"
                           th:value="${videojuego}" placeholder="Ej.: Valorant">
                </div>
                <div class="form-field">
                    <label for="categoria">Categoría / tipo</label>
                    <select id="categoria" name="categoria">
                        <option value="">Todas las categorías</option>
                        <option value="Videojuegos" th:selected="${categoria == 'Videojuegos'}">Videojuegos</option>
                        <option value="Esports" th:selected="${categoria == 'Esports'}">E-Sports</option>
                        <option value="Retro" th:selected="${categoria == 'Retro'}">Retro</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="pais">País</label>
                    <input type="text" id="pais" name="pais"
                           th:value="${pais}" placeholder="Ej.: Chile">
                </div>
                <div class="form-field">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad"
                           th:value="${ciudad}" placeholder="Ej.: Santiago">
                </div>
                <div class="form-field">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" th:value="${fecha}">
                </div>
                <div class="form-field">
                    <label for="modalidad">Modalidad</label>
                    <select id="modalidad" name="modalidad">
                        <option value="">Todas</option>
                        <option value="PRESENCIAL" th:selected="${modalidad == 'PRESENCIAL'}">Presencial</option>
                        <option value="ONLINE" th:selected="${modalidad == 'ONLINE'}">Online</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Buscar</button>
                    <a th:href="@{/eventos}" class="btn btn--ghost">Limpiar</a>
                </div>
            </form>
        </section>

        <section class="section">
            <div class="grid grid--2" th:if="${!eventos.isEmpty()}">
                <article class="card" th:each="evento : ${eventos}">
                    <span class="badge" th:text="${evento.categoria}">Categoría</span>
                    <h2 th:text="${evento.nombre}">Nombre del evento</h2>
                    <div class="card__meta">
                        <span th:text="${evento.fecha}">Fecha</span>
                        <span th:text="${evento.ciudad}">Ciudad</span>
                        <span th:text="${evento.modalidad}">Modalidad</span>
                    </div>
                    <p th:if="${evento.videojuego != null and !evento.videojuego.isBlank()}">
                        <strong>Juego:</strong>
                        <span th:text="${evento.videojuego}"></span>
                    </p>
                    <a class="btn btn--ghost" th:href="@{/eventos/{id}(id=${evento.id})}">Ver detalle</a>
                </article>
            </div>
            <p class="empty-state panel" th:if="${eventos.isEmpty()}">
                No hay eventos con esos filtros. Prueba limpiar la búsqueda.
            </p>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
