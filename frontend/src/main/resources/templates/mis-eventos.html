<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mis eventos')}">
    <title>Mis eventos</title>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="site-main">
    <div class="container">
        <h1>Mis eventos</h1>
        <p class="section__intro">Creá eventos y agregá fotos o videos a los que publicaste.</p>

        <p class="alert alert--info" th:if="${mensaje != null}" th:text="${mensaje}"></p>

        <section class="section panel">
            <h2>Crear evento</h2>
            <form th:action="@{/mis-eventos}" method="post" class="form-stack">
                <div class="form-filters">
                    <div class="form-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-field">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria" required>
                            <option value="Videojuegos">Videojuegos</option>
                            <option value="Esports">E-Sports</option>
                            <option value="Retro">Retro</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="videojuego">Videojuego</label>
                        <input type="text" id="videojuego" name="videojuego" required>
                    </div>
                    <div class="form-field">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="form-field">
                        <label for="hora">Hora</label>
                        <input type="time" id="hora" name="hora" required>
                    </div>
                    <div class="form-field">
                        <label for="modalidad">Modalidad</label>
                        <select id="modalidad" name="modalidad" required>
                            <option value="PRESENCIAL">Presencial</option>
                            <option value="ONLINE">Online</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="pais">País</label>
                        <input type="text" id="pais" name="pais" value="Chile" required>
                    </div>
                    <div class="form-field">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" required>
                    </div>
                    <div class="form-field">
                        <label for="direccion">Dirección / recinto</label>
                        <input type="text" id="direccion" name="direccion" required>
                    </div>
                    <div class="form-field">
                        <label for="organizador">Organizador</label>
                        <input type="text" id="organizador" name="organizador" required>
                    </div>
                </div>
                <div class="form-field">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
                </div>
                <div class="form-field">
                    <label for="servicios">Servicios</label>
                    <textarea id="servicios" name="servicios" rows="2"></textarea>
                </div>
                <div class="form-field">
                    <label for="expositores">Expositores</label>
                    <textarea id="expositores" name="expositores" rows="2"></textarea>
                </div>
                <div class="form-field form-field--check">
                    <input type="checkbox" id="destacado" name="destacado" value="true">
                    <label for="destacado">Marcar como destacado</label>
                </div>
                <button type="submit" class="btn btn--primary">Crear evento</button>
            </form>
        </section>

        <section class="section">
            <h2>Eventos publicados</h2>
            <div class="grid grid--2" th:if="${!eventos.isEmpty()}">
                <article class="card" th:each="evento : ${eventos}">
                    <span class="badge" th:text="${evento.categoria}">Categoría</span>
                    <h3 th:text="${evento.nombre}">Nombre</h3>
                    <div class="card__meta">
                        <span th:text="${evento.fecha}">Fecha</span>
                        <span th:text="${evento.ciudad}">Ciudad</span>
                        <span th:text="${evento.modalidad}">Modalidad</span>
                    </div>
                    <p th:text="${evento.descripcion}">Descripción</p>
                    <a class="btn btn--ghost" th:href="@{/eventos/{id}(id=${evento.id})}">Ver detalle</a>

                    <div style="margin-top: 1rem;">
                        <h4>Media</h4>
                        <div class="media-grid" th:if="${mediaPorEvento[evento.id] != null and !mediaPorEvento[evento.id].isEmpty()}">
                            <div th:each="item : ${mediaPorEvento[evento.id]}" class="media-item">
                                <img th:if="${item.media.imagen}"
                                     th:src="${item.url}"
                                     th:alt="${item.media.nombreOriginal}"
                                     class="media-thumb">
                                <video th:if="${item.media.video}"
                                       th:src="${item.url}"
                                       controls
                                       class="media-thumb"></video>
                                <form th:action="@{/mis-eventos/{id}/media/{mediaId}/eliminar(id=${evento.id}, mediaId=${item.media.id})}"
                                      method="post">
                                    <button type="submit" class="btn btn--danger"
                                            style="padding: 0.3rem 0.7rem; font-size: 0.8rem;">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </div>
                        <p th:if="${mediaPorEvento[evento.id] == null or mediaPorEvento[evento.id].isEmpty()}">
                            Todavía no hay fotos ni videos.
                        </p>

                        <form th:action="@{/mis-eventos/{id}/media(id=${evento.id})}"
                              method="post"
                              enctype="multipart/form-data"
                              class="form-stack"
                              style="margin-top: 0.75rem;">
                            <div class="form-field">
                                <label th:for="'archivo-' + ${evento.id}">Foto o video</label>
                                <input type="file"
                                       th:id="'archivo-' + ${evento.id}"
                                       name="archivo"
                                       accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"
                                       required>
                            </div>
                            <button type="submit" class="btn btn--primary">Subir archivo</button>
                        </form>
                    </div>
                </article>
            </div>
            <p class="empty-state panel" th:if="${eventos.isEmpty()}">
                Todavía no publicaste eventos.
            </p>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
