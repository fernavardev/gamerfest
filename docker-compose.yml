services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gamerfest
      MYSQL_USER: gamerfest
      MYSQL_PASSWORD: gamerfest123
      MYSQL_ROOT_PASSWORD: rootgamerfest
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootgamerfest"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
