# Perfil de test: H2 en memoria (sin MySQL ni variables de entorno)
spring.datasource.url=jdbc:h2:mem:gamerfest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

gamerfest.jwt.secret=test-secret-key-con-al-menos-32-chars!!
gamerfest.upload-dir=target/gamerfest-test-uploads
gamerfest.frontend-base-url=http://localhost:8080
