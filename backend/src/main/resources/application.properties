spring.application.name=gamerfest
server.port=8081

# Conexion MySQL - GamerFest (credenciales vía variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gamerfest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gamerfest}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Persistencia JPA
spring.jpa.hibernate.ddl-auto=update
